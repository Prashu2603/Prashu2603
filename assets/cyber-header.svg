<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#07152B"/>
      <stop offset="1" stop-color="#0B1024"/>
    </linearGradient>
    <linearGradient id="title" x1="330" y1="0" x2="870" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="auroraCyan">
      <stop stop-color="#22D3EE" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraPurple">
      <stop stop-color="#8B5CF6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#22D3EE" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="20" y="20" width="1160" height="320" rx="24"/></clipPath>
  </defs>

  <rect x="20" y="20" width="1160" height="320" rx="24" fill="url(#bg)" stroke="#22D3EE" stroke-opacity=".24" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <circle cx="160" cy="80" r="280" fill="url(#auroraCyan)">
      <animate attributeName="cx" values="120;280;120" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="310" r="300" fill="url(#auroraPurple)">
      <animate attributeName="cy" values="300;150;300" dur="12s" repeatCount="indefinite"/>
    </circle>
    <rect x="20" y="20" width="1160" height="320" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 40" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="20" width="1160" height="2" fill="#22D3EE" opacity=".45" filter="url(#glow)">
      <animate attributeName="y" values="25;335;25" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.5;0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <g fill="#67E8F9">
      <circle cx="90" cy="250" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="125" r="2"><animate attributeName="opacity" values="1;.15;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1030" cy="100" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="260" r="2"><animate attributeName="opacity" values="1;.2;1" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g font-family="'Segoe UI', Inter, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="145" fill="url(#title)" font-size="62" font-weight="800" letter-spacing="-1" filter="url(#glow)">Prasanth Veluri</text>
    <text x="600" y="190" fill="#94A3B8" font-size="20" letter-spacing="3">CYBERSECURITY  •  AI / ML  •  PYTHON</text>
    <g transform="translate(385 225)">
      <rect width="430" height="46" rx="23" fill="#FFFFFF" fill-opacity=".045" stroke="#22D3EE" stroke-opacity=".3"/>
      <circle cx="25" cy="23" r="6" fill="#10B981">
        <animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="230" y="29" fill="#A5F3FC" font-size="16" font-family="'Courier New', monospace">Open to opportunities &amp; collaboration</text>
    </g>
  </g>

  <path d="M42 72V44Q42 42 44 42H72M1128 42H1156Q1158 42 1158 44V72M42 288V316Q42 318 44 318H72M1128 318H1156Q1158 318 1158 316V288" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" opacity=".75"/>
</svg>
