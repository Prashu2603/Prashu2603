<svg width="1200" height="1460" viewBox="0 0 1200 1460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="1460"><stop stop-color="#020617"/><stop offset=".55" stop-color="#07152B"/><stop offset="1" stop-color="#0B1024"/></linearGradient>
    <linearGradient id="accent" x1="70" y1="0" x2="1130" y2="0"><stop stop-color="#22D3EE"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <radialGradient id="a"><stop stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#22D3EE" stroke-opacity=".035"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:700 31px 'Segoe UI',Arial,sans-serif;fill:#E2E8F0}.label{font:600 16px 'Courier New',monospace;fill:#22D3EE;letter-spacing:3px}.body{font:20px 'Segoe UI',Arial,sans-serif;fill:#CBD5E1}.muted{font:17px 'Segoe UI',Arial,sans-serif;fill:#94A3B8}.role{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#F1F5F9}.date{font:600 16px 'Courier New',monospace;fill:#67E8F9}.pill{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#CFFAFE}
    </style>
  </defs>
  <rect x="18" y="10" width="1164" height="1435" rx="28" fill="url(#panel)" stroke="#22D3EE" stroke-opacity=".22" stroke-width="2"/>
  <rect x="18" y="10" width="1164" height="1435" rx="28" fill="url(#grid)"/>
  <circle cx="110" cy="160" r="250" fill="url(#a)"><animate attributeName="cx" values="90;260;90" dur="12s" repeatCount="indefinite"/></circle>
  <rect x="50" y="44" width="1100" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>

